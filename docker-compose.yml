# docker-compose.yml
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sentiment_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes: 
      - ./models_cache:/app/models_cache # MONTER LE CACHE LOCAL
      - ./tests/test_audio:/app/tests/test_audio
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - HF_HOME=/app/models_cache
      - LOG_LEVEL=INFO
      - TOKENIZERS_PARALLELISM=false  # Éviter les warnings
    networks:
      - sentiment-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  gradio:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    container_name: sentiment_gradio
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      # ✅ MONTER LE CACHE LOCAL
      - ./models_cache:/app/models_cache
      - ./tests/test_audio:/app/tests/test_audio
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - HF_HOME=/app/models_cache
      - API_URL=http://api:8000
      - LOG_LEVEL=INFO
      - TOKENIZERS_PARALLELISM=false
    depends_on:
      api:
        condition: service_started
    networks:
      - sentiment-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

networks:
  sentiment-network:
    driver: bridge